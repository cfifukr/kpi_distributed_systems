spring.application.name=messaging-service
server.port=0
eureka.client.service-url.defaultZone =  http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


eureka.instance.instance-id=${spring.application.name}:${random.int[1000,9999]}

eureka.instance.hostname=localhost

eureka.instance.prefer-ip-address=true

eureka.client.instance-info-replication-interval-seconds=5

eureka.instance.lease-renewal-interval-in-seconds=1
eureka.instance.lease-expiration-duration-in-seconds=2

spring.kafka.consumer.group-id=group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-serializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-serializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.admin.auto-create=true

