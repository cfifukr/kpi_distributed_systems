spring.application.name=gateway

server.port=8890
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


eureka.instance.instance-id=${spring.application.name}:${random.int[1000,9999]}

eureka.instance.hostname=localhost

eureka.instance.prefer-ip-address=true

eureka.client.instance-info-replication-interval-seconds=5

eureka.instance.lease-renewal-interval-in-seconds=1
eureka.instance.lease-expiration-duration-in-seconds=2


spring.cloud.gateway.routes[0].id=logging-service
spring.cloud.gateway.routes[0].uri=lb://logging-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/logging/**


spring.cloud.gateway.routes[1].id=facade-service
spring.cloud.gateway.routes[1].uri=lb://facade-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/facade/**


spring.cloud.gateway.routes[2].id=messaging-service
spring.cloud.gateway.routes[2].uri=lb://messaging-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/messaging/**

spring.cloud.gateway.routes[3].id=kafka-node
spring.cloud.gateway.routes[3].uri=lb://kafka-node
spring.cloud.gateway.routes[3].predicates[0]=Path=/brokers


